name: Pinterest Auto Poster

on:
  schedule:
    # 毎日日本時間 20:00 (11:00 UTC) に実行
    - cron: '0 11 * * *'
  workflow_dispatch:
    # 手動実行用

jobs:
  pinterest-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pinterest-tool/package-lock.json'

      - name: Install dependencies
        run: |
          cd pinterest-tool
          npm install

      - name: Run Auto-Generator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          cd pinterest-tool
          node auto-generator.js

      - name: Run Auto-Poster
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd pinterest-tool
          node auto-post.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pinterest-tool/data/post-queue.json pinterest-tool/output/
          
          # 変更がある場合のみコミット&プッシュ
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-generated and posted Pinterest pins [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi

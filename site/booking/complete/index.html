<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Complete your booking — VAN TRIP JAPAN</title>
<style>
  :root { --accent:#C4704B; --accent-dark:#A85A38; --bg:#FAF6F0; --text:#2B2620; --text-sec:#6B6156; --ok:#2F7D4F; --border:#E8DFD1; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans','Noto Sans',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px 64px; }
  .logo { text-align:center; padding:18px 0 6px; font-weight:800; letter-spacing:.08em; color:var(--accent-dark); }
  h1 { font-size:1.35rem; margin:12px 0 4px; }
  .sub { color:var(--text-sec); font-size:.9rem; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:1.02rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .badge { display:inline-block; background:var(--accent); color:#fff; border-radius:999px; font-size:.72rem; padding:2px 10px; font-weight:700; }
  .summary td { padding:4px 8px 4px 0; font-size:.92rem; vertical-align:top; }
  .summary td:first-child { color:var(--text-sec); white-space:nowrap; }
  .docrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border); flex-wrap:wrap; }
  .docrow:last-child { border-bottom:none; }
  .doclabel { font-size:.92rem; font-weight:600; }
  .chip { font-size:.78rem; border-radius:999px; padding:3px 10px; background:#F1EAE0; color:var(--text-sec); }
  .chip.ok { background:#E3F2E8; color:var(--ok); font-weight:700; }
  input[type=file] { display:none; }
  .upbtn { display:inline-block; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:.85rem; font-weight:700; cursor:pointer; }
  .upbtn.secondary { background:#fff; color:var(--accent); border:1.5px solid var(--accent); }
  label.f { display:block; font-size:.85rem; font-weight:600; margin:14px 0 4px; }
  .req { color:var(--accent); }
  input[type=text], select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:.95rem; background:#fff; font-family:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .agree { display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-size:.88rem; }
  .agree input { margin-top:4px; transform:scale(1.2); }
  .submit { display:block; width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:14px; font-size:1rem; font-weight:800; cursor:pointer; margin-top:18px; }
  .submit:disabled { opacity:.5; cursor:not-allowed; }
  .note { font-size:.8rem; color:var(--text-sec); margin-top:8px; }
  .mapcard { background:#FFF8EF; border:1px solid #EFD9BD; }
  .mapcard a { color:var(--accent-dark); font-weight:700; }
  .hidden { display:none; }
  .success { text-align:center; padding:26px 18px; }
  .success .big { font-size:2.4rem; }
  .err { background:#FBEAEA; border:1px solid #E5B8B8; color:#8C3A3A; border-radius:10px; padding:14px; font-size:.9rem; margin-bottom:16px; }
  [dir="rtl"] .summary td:first-child { padding:4px 0 4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">VAN TRIP JAPAN</div>
  <div id="loading" class="card" style="text-align:center;">…</div>
  <div id="invalid" class="hidden err"></div>

  <div id="main" class="hidden">
    <h1 id="t_title"></h1>
    <p class="sub" id="t_sub"></p>

    <div class="card">
      <h2>🚐 <span id="t_summary"></span></h2>
      <table class="summary">
        <tr><td id="t_vehicle"></td><td id="v_vehicle" style="font-weight:700;"></td></tr>
        <tr><td id="t_pickup"></td><td id="v_pickup"></td></tr>
        <tr><td id="t_return"></td><td id="v_return"></td></tr>
      </table>
    </div>

    <div class="card">
      <h2><span class="badge">1</span> <span id="t_docs"></span></h2>
      <p class="note" id="t_docs_note" style="margin:0 0 10px;"></p>

      <label class="f" id="t_license_country" style="margin-top:4px;"></label>
      <select id="in_license_country"></select>
      <div id="req_info" class="hidden" style="margin:10px 0 4px; padding:10px 12px; border-radius:8px; font-size:.85rem; background:#EFF6F0; border:1px solid #CFE3D4;"></div>
      <div id="req_warn" class="hidden err" style="margin:10px 0 4px;"></div>
      <div style="height:8px;"></div>
      <div class="docrow">
        <span class="doclabel" id="t_front"></span>
        <span>
          <span class="chip" id="chip_license_front"></span>
          <label class="upbtn" for="f_license_front" id="b_front"></label>
          <input type="file" id="f_license_front" accept="image/*,.pdf" data-doctype="license_front">
        </span>
      </div>
      <div class="docrow">
        <span class="doclabel" id="t_back"></span>
        <span>
          <span class="chip" id="chip_license_back"></span>
          <label class="upbtn" for="f_license_back" id="b_back"></label>
          <input type="file" id="f_license_back" accept="image/*,.pdf" data-doctype="license_back">
        </span>
      </div>
      <div class="docrow">
        <span class="doclabel" id="t_passport"></span>
        <span>
          <span class="chip" id="chip_passport"></span>
          <label class="upbtn" for="f_passport" id="b_passport"></label>
          <input type="file" id="f_passport" accept="image/*,.pdf" data-doctype="passport">
        </span>
      </div>
      <div class="docrow hidden" id="row_international_license">
        <span class="doclabel" id="t_idp"></span>
        <span>
          <span class="chip" id="chip_international_license"></span>
          <label class="upbtn" for="f_international_license" id="b_idp"></label>
          <input type="file" id="f_international_license" accept="image/*,.pdf" data-doctype="international_license">
        </span>
      </div>
      <div class="hidden" id="jdltc_block" style="padding:12px; margin-top:10px; background:#FFF8EF; border:1px solid #EFD9BD; border-radius:10px;">
        <p style="font-size:.88rem; font-weight:700; margin-bottom:8px;" id="t_jdltc_q"></p>
        <label style="display:flex; gap:8px; align-items:flex-start; font-size:.86rem; margin-bottom:8px; cursor:pointer;">
          <input type="radio" name="jdltc" value="have" style="margin-top:3px;"><span id="t_jdltc_have"></span>
        </label>
        <label style="display:flex; gap:8px; align-items:flex-start; font-size:.86rem; cursor:pointer;">
          <input type="radio" name="jdltc" value="order" style="margin-top:3px;"><span id="t_jdltc_order"></span>
        </label>
      </div>
      <div class="docrow hidden" id="row_translation">
        <span class="doclabel" id="t_translation"></span>
        <span>
          <span class="chip" id="chip_translation"></span>
          <label class="upbtn" for="f_translation" id="b_translation"></label>
          <input type="file" id="f_translation" accept="image/*,.pdf" data-doctype="translation">
        </span>
      </div>
      <p class="note" id="t_upload_hint"></p>
    </div>

    <div class="card">
      <h2><span class="badge">2</span> <span id="t_details"></span></h2>

      <label class="f" id="t_flight"></label>
      <input type="text" id="in_flight_number" maxlength="20" placeholder="e.g. TW215">

      <label class="f" id="t_arrival"></label>
      <input type="text" id="in_arrival_time" maxlength="40">

      <label class="f" id="t_adddriver"></label>
      <input type="text" id="in_additional_driver" maxlength="80">

      <label class="f" id="t_emergency"></label>
      <input type="text" id="in_emergency_name" maxlength="80">
      <input type="text" id="in_emergency_phone" maxlength="40" style="margin-top:6px;">

      <label class="f" id="t_requests"></label>
      <textarea id="in_special_requests" maxlength="500"></textarea>

      <div class="agree">
        <input type="checkbox" id="in_agree">
        <label for="in_agree" id="t_agree"></label>
      </div>

      <button class="submit" id="btn_submit" disabled></button>
      <p class="note" id="t_after"></p>
    </div>

    <div class="card mapcard">
      <h2>📍 <span id="t_map_title"></span></h2>
      <p style="font-size:.92rem;" id="t_map_desc"></p>
      <p style="margin-top:8px;"><a href="https://maps.app.goo.gl/Dkb2bSSUM7dWJS7m7" target="_blank" rel="noopener" id="t_map_link"></a></p>
    </div>
  </div>

  <div id="done" class="hidden card success">
    <div class="big">🎉</div>
    <h1 id="d_title"></h1>
    <p class="sub" id="d_sub" style="margin-top:8px;"></p>
    <p style="font-size:.9rem; margin-top:10px;">📍 <a href="https://maps.app.goo.gl/Dkb2bSSUM7dWJS7m7" target="_blank" rel="noopener" id="d_map"></a></p>
  </div>
</div>

    emergency:"איש קשר לחירום (שם וטלפון)", requests:"עוד משהו שכדאי שנדע?",
    agree:'אני מסכים/ה ל<a href="/rent/terms/" target="_blank">תנאי ההשכרה</a> *',
    submit:"שליחת הפרטים", after:"לאחר מכן קארן תבדוק הכול ותשלח קישור תשלום מאובטח בוואטסאפ או במייל.",
    map_title:"מיקום האיסוף", map_desc:"VAN TRIP JAPAN, האקוזאקי, פוקואוקה — כ-10 דקות באוטובוס או מונית מתחנת האקאטה או משדה התעופה פוקואוקה.",
    map_link:"פתיחה ב-Google Maps ←",

    err_link:"הקישור אינו תקין. השתמשו בקישור המדויק שקארן שלחה, או צרו קשר בוואטסאפ.",
    err_upload:"ההעלאה נכשלה. נסו שוב או שלחו את התמונות לקארן בוואטסאפ.",
    err_submit:"השליחה נכשלה. נסו שוב או פנו לקארן בוואטסאפ.",
    need:"נא להעלות את שני צדי הרישיון ואת הדרכון, לבחור סוג מסמך ולאשר את התנאים."
  }
};

const params = new URLSearchParams(location.search);
const id = params.get('id'), token = params.get('token');
let lang = params.get('lang') || 'en';
if (!T[lang]) lang = 'en';
const t = T[lang];
if (lang === 'he') { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'he'; }
else document.documentElement.lang = lang;

const $ = (i) => document.getElementById(i);
const api = `/api/booking-public?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;
const uploadedDocs = new Set();

// 国→必要書類の判定（出典: 警視庁・JAF 2026-07確認。翻訳6=政令指定国 / IDP=ジュネーブ1949締約国。
// 確信のない国はリストに載せず「Other」→check(Karenが個別案内)に落とす安全設計）
const T6 = ['France','Germany','Switzerland','Belgium','Monaco','Taiwan'];
const NO_DRIVE = ['China (mainland)','Vietnam','Indonesia','Brazil'];
const TOP = ['France','Germany','Switzerland','Belgium','Taiwan','Israel','United States','United Kingdom','Australia','New Zealand','Netherlands','Canada','Hong Kong','Thailand','Poland','Portugal','Slovakia','Monaco'];
const GENEVA_REST = ['Albania','Algeria','Argentina','Austria','Bangladesh','Barbados','Benin','Botswana','Bulgaria','Burkina Faso','Cambodia','Central African Republic','Chile','Congo',"Cote d'Ivoire",'Cuba','Cyprus','Czech Republic','Democratic Republic of the Congo','Denmark','Dominican Republic','Ecuador','Egypt','Estonia','Fiji','Finland','Georgia','Ghana','Greece','Guatemala','Haiti','Hungary','Iceland','India','Ireland','Italy','Jamaica','Jordan','Kyrgyzstan','Laos','Lesotho','Luxembourg','Macau','Madagascar','Malawi','Malaysia','Mali','Malta','Montenegro','Morocco','Niger','Norway','Papua New Guinea','Paraguay','Peru','Philippines','Romania','Russia','Rwanda','San Marino','Senegal','Serbia','Sierra Leone','Singapore','Slovenia','South Africa','South Korea','Spain','Sri Lanka','Sweden','Togo','Trinidad and Tobago','Tunisia','Turkey','United Arab Emirates','Venezuela','Zimbabwe'];

function classify(c) {
  if (!c) return null;
  if (c === 'OTHER') return 'check';
  if (T6.includes(c)) return 'translation';
  if (NO_DRIVE.includes(c)) return 'no';
  if (TOP.includes(c) || GENEVA_REST.includes(c)) return 'idp';
  return 'check';
}
function jdltcChoice() {
  const r = document.querySelector('input[name="jdltc"]:checked');
  return r ? r.value : '';
}
function onCountryChange() {
  const req = classify($('in_license_country').value);
  $('req_info').classList.add('hidden');
  $('req_warn').classList.add('hidden');
  $('row_international_license').classList.toggle('hidden', !(req === 'idp' || req === 'check'));
  $('jdltc_block').classList.toggle('hidden', req !== 'translation');
  // 翻訳ルートでは「持っている」を選んだ時だけアップ行を出す。checkでは任意で常時表示
  $('row_translation').classList.toggle('hidden', !((req === 'translation' && jdltcChoice() === 'have') || req === 'check'));
  if (req === 'idp') { $('req_info').innerHTML = t.req_idp; $('req_info').classList.remove('hidden'); }
  if (req === 'translation') { $('req_info').innerHTML = t.req_trans; $('req_info').classList.remove('hidden'); }
  if (req === 'check') { $('req_info').innerHTML = t.req_check; $('req_info').classList.remove('hidden'); }
  if (req === 'no') { $('req_warn').innerHTML = t.req_no; $('req_warn').classList.remove('hidden'); }
  refreshSubmit();
}

function applyTexts() {
  const map = { t_title:'title', t_sub:'sub', t_summary:'summary', t_vehicle:'vehicle', t_pickup:'pickup', t_return:'return',
    t_docs:'docs', t_docs_note:'docs_note', t_front:'front', t_back:'back', t_passport:'passport', t_translation:'translation', t_idp:'idp', t_upload_hint:'upload_hint',
    t_details:'details', t_license_country:'license_country', t_jdltc_q:'jdltc_q', t_jdltc_have:'jdltc_have', t_jdltc_order:'jdltc_order',
    t_flight:'flight', t_arrival:'arrival', t_adddriver:'adddriver',
    t_emergency:'emergency', t_requests:'requests', t_after:'after', t_map_title:'map_title', t_map_desc:'map_desc',
    t_map_link:'map_link', d_title:'d_title', d_sub:'d_sub', d_map:'d_map' };
  for (const [el, key] of Object.entries(map)) { if ($(el)) $(el).innerHTML = t[key]; }
  $('t_agree').innerHTML = t.agree;
  $('btn_submit').textContent = t.submit;
  ['b_front','b_back','b_passport','b_idp','b_translation'].forEach((b) => $(b).textContent = t.upload);
  // 国セレクトを構築（主要マーケットを先頭に）
  const sel = $('in_license_country');
  sel.innerHTML = '';
  const opt = (v, label, dis) => { const o = document.createElement('option'); o.value = v; o.textContent = label; if (dis) o.disabled = true; return o; };
  sel.appendChild(opt('', t.country_choose));
  TOP.forEach((c) => sel.appendChild(opt(c, c)));
  sel.appendChild(opt('', '──────────', true));
  [...new Set([...GENEVA_REST, ...NO_DRIVE])].filter((c) => !TOP.includes(c)).sort()
    .forEach((c) => sel.appendChild(opt(c, c)));
  sel.appendChild(opt('OTHER', t.country_other));
}

function refreshChips() {
  for (const type of ['license_front','license_back','passport','international_license','translation']) {
    const chip = $('chip_' + type);
    if (uploadedDocs.has(type)) { chip.textContent = t.uploaded; chip.className = 'chip ok'; }
    else { chip.textContent = t.pending; chip.className = 'chip'; }
  }
  refreshSubmit();
}

function refreshSubmit() {
  const req = classify($('in_license_country').value);
  const baseDocs = uploadedDocs.has('license_front') && uploadedDocs.has('license_back') && uploadedDocs.has('passport');
  let drivingOk = false;
  if (req === 'idp') drivingOk = uploadedDocs.has('international_license');
  else if (req === 'translation') drivingOk = jdltcChoice() === 'order' || (jdltcChoice() === 'have' && uploadedDocs.has('translation'));
  else if (req === 'check') drivingOk = true;
  const ready = !!req && req !== 'no' && baseDocs && drivingOk && $('in_agree').checked;
  $('btn_submit').disabled = !ready;
}

async function init() {
  applyTexts();
  if (!id || !token) { $('loading').classList.add('hidden'); $('invalid').textContent = t.err_link; $('invalid').classList.remove('hidden'); return; }
  try {
    const res = await fetch(api);
    if (!res.ok) throw new Error('bad');
    const b = await res.json();
    $('v_vehicle').textContent = b.vehicle || '—';
    $('v_pickup').textContent = (b.pickup || '—').replace('T', ' ');
    $('v_return').textContent = (b.return || '—').replace('T', ' ');
    (b.docs || []).forEach((d) => uploadedDocs.add(d));
    $('t_title').textContent = b.first_name ? `${t.title} — ${b.first_name}!` : t.title;
    refreshChips();
    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
  } catch {
    $('loading').classList.add('hidden');
    $('invalid').textContent = t.err_link;
    $('invalid').classList.remove('hidden');
  }
}

document.querySelectorAll('input[type=file]').forEach((input) => {
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('Max 10MB'); return; }
    const type = input.dataset.doctype;
    const chip = $('chip_' + type);
    chip.textContent = t.uploading; chip.className = 'chip';
    const fd = new FormData();
    fd.append('file', file); fd.append('doc_type', type); fd.append('booking_id', id);
    try {
      const res = await fetch('/api/documents', { method: 'POST', body: fd });
      if (!res.ok) throw new Error('upload failed');
      uploadedDocs.add(type);
    } catch { alert(t.err_upload); }
    refreshChips();
  });
});

$('in_license_country').addEventListener('change', onCountryChange);
$('in_agree').addEventListener('change', refreshSubmit);
document.querySelectorAll('input[name="jdltc"]').forEach((r) => r.addEventListener('change', onCountryChange));

$('btn_submit').addEventListener('click', async () => {
  refreshSubmit();
  if ($('btn_submit').disabled) { alert(t.need); return; }
  $('btn_submit').disabled = true;
  try {
    const res = await fetch(api, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        flight_number: $('in_flight_number').value,
        arrival_time: $('in_arrival_time').value,
        license_country: $('in_license_country').value,
        requirement: classify($('in_license_country').value) || '',
        jdltc_order: jdltcChoice() === 'order' ? 'yes' : '',
        idp_type: (function(){ const r = classify($('in_license_country').value); if (r === 'translation') return jdltcChoice() === 'order' ? 'jdltc_order' : 'jdltc_translation'; if (r === 'idp') return 'idp_1949'; return 'unsure'; })(),
        additional_driver: $('in_additional_driver').value,
        emergency_name: $('in_emergency_name').value,
        emergency_phone: $('in_emergency_phone').value,
        special_requests: $('in_special_requests').value,
        agree_terms: $('in_agree').checked,
      }),
    });
    if (!res.ok) throw new Error('submit failed');
    $('main').classList.add('hidden');
    $('done').classList.remove('hidden');
    window.scrollTo(0, 0);
  } catch {
    alert(t.err_submit);
    $('btn_submit').disabled = false;
  }
});

init();
</script>
</body>
</html>
